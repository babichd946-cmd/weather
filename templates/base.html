<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Analytics App</title>
    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Стилі Solar Orchard -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>

    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-5">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{{ url_for('index') }}">WeatherApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Пошук погоди</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('compare_cities') }}">Порівняння міст</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('saved_records') }}">Збережені записи</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Головний контент -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
